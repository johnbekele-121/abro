---
name: Deploy production

# Never triggered by a push. A published release or a deliberate dispatch only, and the
# `production` environment carries the required reviewers, so approval is a GitHub
# control rather than a convention.
#
# Required secrets, all on the `production` environment: AWS_ROLE_ARN,
# PULUMI_ACCESS_TOKEN. Production boots refuse to start while any provider is still
# `mock`, so the live provider credentials are configuration on the service, not here.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      confirm:
        description: Type the release tag to confirm
        required: true
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://abro.et
    permissions:
      contents: read
      id-token: write
    env:
      HAS_CREDENTIALS: ${{ secrets.AWS_ROLE_ARN != '' && secrets.PULUMI_ACCESS_TOKEN != '' }}
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Report missing credentials
        if: env.HAS_CREDENTIALS != 'true'
        run: |
          echo "::notice::Production credentials are not configured yet, so nothing was" \
            "deployed. Set AWS_ROLE_ARN and PULUMI_ACCESS_TOKEN on the production environment."

      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        if: env.HAS_CREDENTIALS == 'true'
        with:
          format: spdx-json
          artifact-name: abro-sbom.spdx.json

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        if: env.HAS_CREDENTIALS == 'true'
        with:
          python-version: '3.12'
          enable-cache: true

      - name: pulumi up
        if: env.HAS_CREDENTIALS == 'true'
        working-directory: abro-infra
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
        run: |
          uv sync --all-extras --dev
          uv run pulumi up --stack production --yes --non-interactive

      - name: Smoke test
        if: env.HAS_CREDENTIALS == 'true'
        run: curl --fail --silent --show-error https://abro.et/healthz

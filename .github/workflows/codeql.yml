---
name: CodeQL

# Each language is analysed only once source for it exists. CodeQL fails a run that
# finds no code, and a permanently red weekly scan is a scan everyone learns to ignore.

on:
  pull_request:
    paths:
      - abro-api/**
      - abro-web/**
      - abro-mobile/**
      - packages/**
      - abro-infra/**
  push:
    branches: [main]
    paths:
      - abro-api/**
      - abro-web/**
      - abro-mobile/**
      - packages/**
      - abro-infra/**
  schedule:
    - cron: '30 3 * * 1'
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            sources: abro-api/**
          - language: javascript-typescript
            sources: abro-web/**
          - language: actions
            sources: .github/workflows/**
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: sources
        run: |
          if [ -n "${{ hashFiles(matrix.sources) }}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v3
        if: steps.sources.outputs.present == 'true'
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - uses: github/codeql-action/autobuild@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v3
        if: steps.sources.outputs.present == 'true'

      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v3
        if: steps.sources.outputs.present == 'true'
        with:
          category: /language:${{ matrix.language }}
